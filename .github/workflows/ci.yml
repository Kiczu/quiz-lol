name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Install functions
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions
